name: pssa-sarif
run-name: pssa-sarif

on:
  workflow_call:

permissions:
  contents: read

jobs:
  analyze:
    permissions:
      contents: read           # for actions/checkout to fetch code
      security-events: write   # for github/codeql-action/upload-sarif
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The harness supplies the shared analyzer settings and the PSScriptAnalyzer pin,
      # so the Security tab and the build gate apply the same rules at the same version.
      - name: Check out the build harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .harness
          persist-credentials: false

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # PSResourceGet never calls Get-PackageSource, so the unregistered-PSGallery flake cannot recur (#27).
          $moduleParams = @{
            Scope           = 'CurrentUser'
            Repository      = 'PSGallery'
            TrustRepository = $true
            ErrorAction     = 'Stop'
          }

          $pssaVersion = (Import-PowerShellDataFile -Path './.harness/Build/depend.psd1')['PSScriptAnalyzer']
          Install-PSResource -Name 'PSScriptAnalyzer' -Version $pssaVersion @moduleParams
          Install-PSResource -Name 'ConvertToSARIF' @moduleParams

          Import-Module -Name 'PSScriptAnalyzer' -RequiredVersion $pssaVersion -Force -ErrorAction Stop
          Import-Module -Name 'ConvertToSARIF' -Force -ErrorAction Stop

          # Skips .harness/: -Recurse on the checkout root would report the harness's own code too.
          . ./.harness/Build/Harness.Functions.ps1
          Invoke-HarnessAnalysis -ProjectPath $env:GITHUB_WORKSPACE | ConvertTo-SARIF -FilePath 'results.sarif'

      - name: Upload SARIF results file
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
