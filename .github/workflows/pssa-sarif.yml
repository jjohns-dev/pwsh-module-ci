name: pssa-sarif
run-name: pssa-sarif

on:
  workflow_call:
    inputs:
      upload-sarif:
        description: >-
          Upload the findings to the Security tab as SARIF. Set false on a private repo without GitHub Code Security:
          the findings are annotated on the run and in its summary instead, and the job fails on an Error finding.
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  analyze:
    permissions:
      contents: read           # for actions/checkout to fetch code
      security-events: write   # for github/codeql-action/upload-sarif
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    steps:
      - name: Check out the module
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The harness supplies the shared analyzer settings and the PSScriptAnalyzer pin,
      # so the Security tab and the build gate apply the same rules at the same version.
      - name: Check out the build harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .harness
          persist-credentials: false

      # checkout only accepts a path under the workspace; keep the harness out of the scanned tree (#77).
      - name: Move the build harness out of the workspace
        shell: pwsh
        run: Move-Item -LiteralPath '.harness' -Destination (Join-Path -Path $env:RUNNER_TEMP -ChildPath 'harness')

      - name: Run PSScriptAnalyzer
        if: ${{ inputs.upload-sarif }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # PSResourceGet never calls Get-PackageSource, so the unregistered-PSGallery flake cannot recur (#27).
          $moduleParams = @{
            Scope           = 'CurrentUser'
            Repository      = 'PSGallery'
            TrustRepository = $true
            ErrorAction     = 'Stop'
          }

          $pssaVersion = (Import-PowerShellDataFile -LiteralPath "$env:RUNNER_TEMP/harness/Build/depend.psd1")['PSScriptAnalyzer']
          Install-PSResource -Name 'PSScriptAnalyzer' -Version $pssaVersion @moduleParams
          Install-PSResource -Name 'ConvertToSARIF' @moduleParams

          Import-Module -Name 'PSScriptAnalyzer' -RequiredVersion $pssaVersion -Force -ErrorAction Stop
          Import-Module -Name 'ConvertToSARIF' -Force -ErrorAction Stop

          . "$env:RUNNER_TEMP/harness/Build/Harness.Functions.ps1"
          Invoke-HarnessAnalysis -ProjectPath $env:GITHUB_WORKSPACE | ConvertTo-SARIF -FilePath 'results.sarif'

      # No SARIF, so no upload and no code scanning requirement: report in the run itself (#99). The same
      # harness analysis and PSScriptAnalyzer pin as above, so the rules and scope do not diverge.
      - name: Report PSScriptAnalyzer findings
        if: ${{ !inputs.upload-sarif }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $moduleParams = @{
            Scope           = 'CurrentUser'
            Repository      = 'PSGallery'
            TrustRepository = $true
            ErrorAction     = 'Stop'
          }

          $pssaVersion = (Import-PowerShellDataFile -LiteralPath "$env:RUNNER_TEMP/harness/Build/depend.psd1")['PSScriptAnalyzer']
          Install-PSResource -Name 'PSScriptAnalyzer' -Version $pssaVersion @moduleParams
          Import-Module -Name 'PSScriptAnalyzer' -RequiredVersion $pssaVersion -Force -ErrorAction Stop

          . "$env:RUNNER_TEMP/harness/Build/Harness.Functions.ps1"
          $findings = @(Invoke-HarnessAnalysis -ProjectPath $env:GITHUB_WORKSPACE)
          Write-HarnessAnalysisReport -Finding $findings -ProjectPath $env:GITHUB_WORKSPACE -SummaryPath $env:GITHUB_STEP_SUMMARY

      - name: Upload SARIF results file
        if: ${{ inputs.upload-sarif }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
