name: ci
run-name: ci

on:
  workflow_call:
    inputs:
      os-matrix:
        description: 'JSON array of runner OSes, or of objects carrying os plus optional pesterScope and minTests'
        required: false
        type: string
        default: '["ubuntu-latest", "windows-latest", "macos-latest"]'
      min-tests:
        description: 'Fail when a Pester result file executes fewer tests than this (collected minus disabled); 0 disables the check. A per-leg minTests in os-matrix overrides it'
        required: false
        type: number
        default: 0

permissions:
  contents: read
  checks: write

jobs:
  # Normalising here rather than taking a second input is deliberate: when `os:`
  # and `include:` coexist, an `os` leg that no include entry matches still runs
  # with empty values, which would reach psake as its default scope and pass.
  # Measured in run 42295351419; see ADR-0006.
  normalize:
    name: normalize matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {} # reads an input and writes a job output; touches nothing
    outputs:
      matrix: ${{ steps.norm.outputs.matrix }}
    steps:
      - name: Expand os-matrix to include form
        id: norm
        shell: pwsh
        env:
          OS_MATRIX: ${{ inputs.os-matrix }}
        run: |
          $ErrorActionPreference = 'Stop'

          try { $parsed = @($env:OS_MATRIX | ConvertFrom-Json) }
          catch { throw ('os-matrix is not valid JSON: {0}' -f $_.Exception.Message) }

          if ($parsed.Count -eq 0) { throw 'os-matrix is empty; at least one runner is required.' }

          $include = foreach ($entry in $parsed) {
              if ($entry -is [string]) { @{ os = $entry }; continue }
              if (-not $entry.os) { throw ('os-matrix object entry has no os key: {0}' -f ($entry | ConvertTo-Json -Compress)) }
              $entry
          }

          $json = ConvertTo-Json -InputObject @($include) -Compress -Depth 5
          Write-Host ('normalized os-matrix: {0}' -f $json)
          ('matrix={0}' -f $json) | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          exit 0

  validate:
    needs: normalize
    name: validate (${{ matrix.os }})
    strategy:
      # false keeps the other runners going if one OS fails, so cross-OS
      # divergence surfaces in a single run instead of fix-push-wait-repeat.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.normalize.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The harness at this workflow's own commit, so the two cannot drift apart.
      - name: Check out the build harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .harness
          persist-credentials: false

      # checkout only accepts a path under the workspace; on Windows a dot-folder is not hidden, so consumer tests that walk the repo would find it (#77).
      - name: Move the build harness out of the workspace
        shell: pwsh
        run: Move-Item -LiteralPath '.harness' -Destination (Join-Path -Path $env:RUNNER_TEMP -ChildPath 'harness')

      - shell: pwsh # install dependencies (Pester, psake, PSScriptAnalyzer, the module's RequiredModules)
        run: |
          & "$env:RUNNER_TEMP/harness/Build/build.ps1" -ProjectPath $env:GITHUB_WORKSPACE -ResolveDependency -TaskList 'Init'

      - shell: pwsh # stage module (copy sources into Staging/)
        run: |
          & "$env:RUNNER_TEMP/harness/Build/build.ps1" -ProjectPath $env:GITHUB_WORKSPACE -TaskList 'CombineFunctionsAndStage'

      - shell: pwsh # psscriptanalyzer
        run: |
          & "$env:RUNNER_TEMP/harness/Build/build.ps1" -ProjectPath $env:GITHUB_WORKSPACE -TaskList 'Analyze'

      - shell: pwsh # pester
        id: pester
        env:
          # Read from env, never interpolated into the script: this value is
          # caller-supplied once the harness is centralised.
          PESTER_SCOPE: ${{ matrix.pesterScope }}
        run: |
          $ErrorActionPreference = 'Stop'
          $harnessParams = @{ ProjectPath = $env:GITHUB_WORKSPACE; TaskList = 'Test' }
          # An absent matrix key is '', not null. Passing @{ PesterScope = '' }
          # would override the harness default with nothing; omit it instead.
          if (-not [string]::IsNullOrWhiteSpace($env:PESTER_SCOPE)) {
              $harnessParams['Properties'] = @{ PesterScope = $env:PESTER_SCOPE }
          }
          & "$env:RUNNER_TEMP/harness/Build/build.ps1" @harnessParams

      - name: Verify Pester results
        shell: pwsh
        # Gated on the Pester step having run, not on always(): when an earlier
        # step fails there is no result file, and an unconditional check would
        # bury that real failure under a misleading "no result file" error.
        # A step that never started reports outcome 'skipped', not '' -- measured,
        # not inferred. Do not rewrite this as a positive test; see AGENTS.md.
        if: always() && steps.pester.outcome != 'skipped'
        env:
          # A per-leg minTests wins over the workflow-wide input; '' is falsy,
          # so a leg that declares none falls back to inputs.min-tests.
          MIN_TESTS: ${{ matrix.minTests || inputs.min-tests }}
        run: |
          $ErrorActionPreference = 'Stop'

          $files = @(Get-ChildItem -Path 'Artifacts' -Filter 'Test-*.xml' -Recurse -ErrorAction SilentlyContinue)
          if ($files.Count -eq 0) {
              throw 'No Pester result file was produced under Artifacts/.'
          }

          # An unset MIN_TESTS reads as 0, which disables the floor check below.
          $minTests = [int]($env:MIN_TESTS -as [int])

          $problems = @()

          foreach ($f in $files) {
              [xml]$doc = Get-Content -Path $f.FullName -Raw
              $root = $doc.DocumentElement

              # Counts are read from the root <testsuites>. The child <testsuite>
              # reports errors="0" for the same run, so a check written against the
              # child parses cleanly and never fires.
              #
              # LocalName, not Name: PowerShell's XML adapter surfaces attributes as
              # properties, so $root.Name returns the name="Pester" attribute rather
              # than the element name. Attributes are read with GetAttribute() for the
              # same reason.
              if ($root.LocalName -ne 'testsuites') {
                  $problems += ('{0}: expected a JUnit <testsuites> root, found <{1}>. Pester must be configured with TestResult.OutputFormat = JUnitXml.' -f $f.Name, $root.LocalName)
                  continue
              }

              $tests = [int]($root.GetAttribute('tests') -as [int])
              $errors = [int]($root.GetAttribute('errors') -as [int])
              $failures = [int]($root.GetAttribute('failures') -as [int])

              # Pester's JUnitXml routes skipped and tag-excluded tests to 'disabled'
              # and still counts them in 'tests', so a mass-skip regression leaves
              # 'tests' untouched. The floor measures what actually ran. An absent
              # attribute reads as 0, so a file without it is unaffected.
              $disabled = [int]($root.GetAttribute('disabled') -as [int])
              $executed = $tests - $disabled

              Write-Host ('{0}: tests={1} disabled={2} executed={3} errors={4} failures={5}' -f $f.Name, $tests, $disabled, $executed, $errors, $failures)

              # Discovery and container errors attach to the container rather than
              # to a test, so a psake gate reading FailedCount leaves them invisible.
              if ($errors -gt 0) {
                  $problems += ('{0}: {1} container/discovery error(s); part of the suite was never collected.' -f $f.Name, $errors)
              }

              if ($tests -eq 0) {
                  $problems += ('{0}: no tests were collected.' -f $f.Name)
              }
              # A suite can shrink without any discovery error: a glob that stops
              # matching, a file moved out of Run.Path, a -ForEach source that shrinks.
              # It can also stop running without shrinking at all, when tests become
              # skipped or tag-excluded, which is why this gates executed not tests.
              elseif ($executed -lt $minTests) {
                  $problems += ('{0}: {1} tests executed ({2} collected, {3} disabled), below the min-tests floor of {4}; part of the suite is no longer running.' -f $f.Name, $executed, $tests, $disabled, $minTests)
              }

              # $failures is reported above but not gated here: a genuine test
              # failure already fails the Pester step via the repo's psake gate.
          }

          if ($problems.Count -gt 0) {
              $problems | ForEach-Object { Write-Host ('::error::{0}' -f $_) }
              throw ('Pester result verification failed with {0} problem(s).' -f $problems.Count)
          }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: Pester Results (${{ matrix.os }})
          path: "Artifacts/**/Test-*.xml"
          if-no-files-found: warn

      - name: Publish Pester results
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        # Only publish when a JUnit file actually exists. This step is display
        # only: fail-on-* stay false because "Verify Pester results" above is the
        # gate, and a missing file is already a hard failure there.
        if: always() && hashFiles('Artifacts/**/Test-*.xml') != ''
        with:
          name: Pester Tests (${{ matrix.os }})
          path: Artifacts/**/Test-*.xml
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false
