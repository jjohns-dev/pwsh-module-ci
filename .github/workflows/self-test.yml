name: self-test
run-name: self-test

on:
  pull_request:
    branches: ["*"]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: self-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-step:
    name: verify Pester result step
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # for actions/checkout to fetch code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install harness dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # PSResourceGet never calls Get-PackageSource, so the unregistered-PSGallery flake cannot recur (#27).
          # Pester is pinned because the runner image ships 5.x and the harness imports 6.2.0 exactly.
          $modules = @(
              @{ Name = 'powershell-yaml'; Version = '0.4.12' }
              @{ Name = 'Pester'; Version = '6.2.0' }
          )

          foreach ($module in $modules) {
              $moduleParams = @{
                  Name            = $module.Name
                  Version         = $module.Version
                  Scope           = 'CurrentUser'
                  Repository      = 'PSGallery'
                  TrustRepository = $true
                  ErrorAction     = 'Stop'
              }
              Install-PSResource @moduleParams
          }

      # Runs the Pester suites in tests/, which extract each run: block with real
      # logic out of ci.yml and release.yml and assert it in both directions.
      - name: Verify the shipped steps behave in both directions
        shell: pwsh
        run: ./tests/Invoke-VerificationTest.ps1
